[package]
name = "alphazero"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Neural AlphaZero training and inference for engine-zoo"
build = "build.rs"

[features]
# Builds and links the raw TensorRT runtime backend (native/raw_trt_runtime.cpp)
# against a locally installed TensorRT (headers under an include path, and
# `libnvinfer`/`libcudart` on the linker search path). Off by default because
# it requires TensorRT to be present at build time, unlike the Torch-TensorRT
# TorchScript path which only needs it at runtime via `dlopen`/`LD_PRELOAD`.
raw-tensorrt = ["dep:cc"]

[dependencies]
anyhow.workspace = true
chess.workspace = true
engine_core = { path = "../core" }
games = { path = "../games" }
half.workspace = true
libc.workspace = true
rand.workspace = true
search = { path = "../search" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tch.workspace = true
toml.workspace = true

[build-dependencies]
cc = { workspace = true, optional = true }

[[bench]]
name = "replay"
harness = false
