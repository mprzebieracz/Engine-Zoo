format_version = 3
seed = 1

[model]
architecture = "chess-se"
history = "four"
blocks = 12
channels = 128
se_hidden = 16
value_head = { wdl = { hidden = 128 } }

[self_play]
num_games = 128
threads = 8

[self_play.search]
algorithm = "full-gumbel"

[self_play.budget_schedule.fixed.gumbel]
simulations = 128
max_considered_actions = 16

[training]
batch_size = 2048
train_steps = 80
