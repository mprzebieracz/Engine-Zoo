format_version = 2
seed = 1

[model]
game = "connect4"
representation = "connect4-canonical"

[model.network]
architecture = "residual"

[model.network.config.trunk.basic]
blocks = 4
channels = 64

[model.network.config.policy_head.dense]
channels = 2

[model.network.config.value_head.scalar]
hidden = 64

[self_play]
num_games = 64
threads = 4

[self_play.search.Puct.common]
simulations = 128
leaf_batch_size = 4

[self_play.budget_schedule.fixed.puct]
simulations = 128

[training]
batch_size = 512
train_steps = 32

