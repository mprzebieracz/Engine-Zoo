format_version = 3
seed = 1

[model]
architecture = "connect4-residual"
blocks = 4
channels = 64
value_head = { scalar = { hidden = 64 } }

[self_play]
num_games = 64
threads = 4

[self_play.search]
algorithm = "puct"
leaf_batch_size = 4

[self_play.budget_schedule.fixed.puct]
simulations = 128

[training]
batch_size = 512
train_steps = 32
