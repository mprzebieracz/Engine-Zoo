format_version = 3
seed = 1

[model]
architecture = "chess-se"
history = "one"
blocks = 12
channels = 128
se_hidden = 16
value_head = { wdl = { hidden = 128 } }

[self_play]
num_games = 200
threads = 16
max_moves = 512
progress_every = 25
evaluation_cache_entries = 1000000

[self_play.search]
algorithm = "puct"
leaf_batch_size = 8

[self_play.budget_schedule.fixed.puct]
simulations = 800

[training]
micro_batch_size = 256
batch_size = 2048
train_steps = 80
progress_every = 10

[inference]
precision = "fp16"
preferred_batch_size = 16
max_batch_size = 256
max_queued_states = 4096

[inference.max_wait]
milliseconds = 5
