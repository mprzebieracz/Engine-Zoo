format_version = 3
seed = 1

[model]
architecture = "chess-se"
history = "four"
blocks = 12
channels = 128
se_hidden = 16
value_head = { scalar = { hidden = 128 } }

[self_play]
num_games = 128
threads = 8

[self_play.search]
algorithm = "puct"
