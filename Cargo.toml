[package]
name = "engine-zoo"
version = "0.1.0"
edition = "2021"
description = "AlphaZero-style engines for board games (Connect4, Chess) in Rust"

[dependencies]
anyhow = "1"
chess = "3.2"
clap = { version = "4", features = ["derive"] }
rand = "0.9"
rand_distr = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tch = "0.20"

[profile.release]
lto = "thin"

# Fast enough for development, keeps debug_assertions for the games' invariants.
[profile.dev]
opt-level = 1
