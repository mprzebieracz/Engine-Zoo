[workspace]
members = [
    "crates/core",
    "crates/games",
    "crates/search",
    "crates/alphazero",
    "crates/app",
    "crates/evaluations",
    "crates/benchmarks",
    "crates/profiling",
    "crates/model-runtime",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/mprzebieracz/Engine-zoo"
authors = ["Mateusz Przebieracz"]

[workspace.dependencies]
anyhow = "1"
axum = "0.8.9"
cc = "1.2"
chess = "3.2"
clap = { version = "4", features = ["derive"] }
half = "2"
libc = "0.2"
rand = "0.9"
rand_distr = "0.5"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
# Keep this in lockstep with the CUDA LibTorch selected in .cargo/config.toml.
tch = "0.24"
toml = "0.8"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }

[profile.release]
lto = "thin"

[profile.dev]
opt-level = 1

[profile.profiling]
inherits = "release"
debug = 1
strip = false
lto = "thin"
