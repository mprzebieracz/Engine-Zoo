[workspace]
members = [
    "core",
    "games",
    "algorithms",
    "app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
axum = "0.8.9"
chess = "3.2"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rand = "0.9"
rand_distr = "0.5"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tch = "0.20"
tokio = { version = "1.52.3", features = ["full"] }

[profile.release]
lto = "thin"

[profile.dev]
opt-level = 1
