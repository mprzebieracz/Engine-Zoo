# Immutable full-iteration baseline for the current default chess recipe.
# Keep this aligned with experiments/chess-puct-wdl.toml; the workload-only
# changes are 500 games and disabled progress output for clean timing.
format_version = 3
seed = 1

[model]
architecture = "chess-se"
history = "four"
blocks = 12
channels = 128
se_hidden = 16
value_head = { wdl = { hidden = 128 } }

[self_play]
num_games = 500
threads = 64
progress_every = 0

[self_play.search]
algorithm = "root-gumbel-puct"
leaf_batch_size = 32

[self_play.budget_schedule.playout-cap-randomization]
full_probability = 0.25
fast_policy_weight = 0.0

[self_play.budget_schedule.playout-cap-randomization.full.gumbel]
simulations = 256
max_considered_actions = 16

[self_play.budget_schedule.playout-cap-randomization.fast.gumbel]
simulations = 64
max_considered_actions = 8

[training]
batch_size = 2048
train_steps = 80
progress_every = 5
max_replay_reuse_per_iteration = 1.0
value_loss_weight = 0.25

[inference]
engine = "native"
precision = "fp16"
preferred_batch_size = 32
max_batch_size = 256
max_queued_states = 4096

[inference.max_wait]
milliseconds = 2
