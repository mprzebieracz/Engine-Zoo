# Benchmark-only architecture matrix: CUDA self-play, inference, and 10 train steps.
format_version = 3
seed = 1

[model]
architecture = "chess-se"
history = "four"
blocks = 12
channels = 128
se_hidden = 16
value_head = { wdl = { hidden = 128 } }

[self_play]
num_games = 64
threads = 24
max_moves = 512
progress_every = 0
evaluation_cache_entries = 1000000

[self_play.search]
algorithm = "root-gumbel-puct"
leaf_batch_size = 16

[self_play.budget_schedule.playout-cap-randomization]
full_probability = 0.25
fast_policy_weight = 0.0

[self_play.budget_schedule.playout-cap-randomization.full.gumbel]
simulations = 256
max_considered_actions = 16

[self_play.budget_schedule.playout-cap-randomization.fast.gumbel]
simulations = 64
max_considered_actions = 8

[training]
train_steps = 10
progress_every = 0

[inference]
precision = "fp16"
preferred_batch_size = 32
max_batch_size = 256
max_queued_states = 4096

[inference.max_wait]
milliseconds = 2
