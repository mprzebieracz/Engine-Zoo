# Leaf-batch tuning screen. Keep every setting fixed except leaf_batch_size.
# The Root-Gumbel 256/64 mixed schedule uses the fastest observed batcher setup.
format_version = 3
seed = 1

[model]
architecture = "chess-se"
history = "one"
blocks = 12
channels = 128
se_hidden = 16
value_head = { wdl = { hidden = 128 } }

[self_play]
num_games = 50
threads = 24
max_moves = 512
progress_every = 0
evaluation_cache_entries = 1000000

[self_play.search]
algorithm = "root-gumbel-puct"
leaf_batch_size = 4

[self_play.budget_schedule.playout-cap-randomization]
full_probability = 0.25
fast_policy_weight = 0.0

[self_play.budget_schedule.playout-cap-randomization.full.gumbel]
simulations = 256
max_considered_actions = 16

[self_play.budget_schedule.playout-cap-randomization.fast.gumbel]
simulations = 64
max_considered_actions = 8

[training]
micro_batch_size = 256
batch_size = 2048
train_steps = 80
progress_every = 0

[inference]
precision = "fp16"
preferred_batch_size = 128
max_batch_size = 256
max_queued_states = 4096

[inference.max_wait]
milliseconds = 2
